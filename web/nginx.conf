server {
  listen 80;
  root /usr/share/nginx/html;
  location ~ /internal/ { return 404; }
  location /api/user/    { proxy_pass http://user-service:8000/; }
  location /api/tuition/ { proxy_pass http://tuition-service:8000/; }
  location /api/payment/ { proxy_pass http://payment-service:8000/; }
}